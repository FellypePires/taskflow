name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest-cov ruff
      - name: Verificar estilo
        run: ruff check app tests
      - name: Executar testes com cobertura mínima de 70%
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
